name: Reset Notion Checklist

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node reset.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DAILY_GOAL_BLOCK_ID: ${{ secrets.DAILY_GOAL_BLOCK_ID }}
